<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Update</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="userinformation.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="/cart/js/userAvatar.js"></script>

</head>
<body>
<div class="container">
    <aside>
        <div class="top">
            <div class="logo">
                <h2>T<span>astyBite</span></h2>
            </div>
            <div class="close" id="close_bar">
                <span class="material-symbols-outlined">close</span>
            </div>
        </div>

        <div class="sidebar">
            <a href="/cart/Cdashboard/Cdashboard.html">
                <span class="material-symbols-outlined">dashboard</span>
                <h3>Dashboard</h3>
            </a>
            <a href="/cart/Cdashboard/userinformation/userinformation.html" class="active">
                <span class="material-symbols-outlined">account_circle</span>
                <h3>User Information</h3>
            </a>
            <a href="/cart/Cdashboard/adress/adress.html">
                        <span class="material-symbols-outlined">
                            home
                            </span>
                <h3>Address</h3>
            </a>

            <a href="/cart/Cdashboard/favorite/favorite.html">
                        <span class="material-symbols-outlined">
                            kid_star
                            </span>
                <h3>Favorites</h3>
            </a>

            <a href="/cart/Cdashboard/historyorder/historyorder.html">
                        <span class="material-symbols-outlined">
                            list_alt
                            </span>
                <h3>History Order</h3>
            </a>
            <a href="#" id="logoutBtn">
                <span class="material-symbols-outlined">logout</span>
                <h3>Logout</h3>
            </a>
        </div>

    </aside>
    <main>
        <h1>Update User Profile</h1>
        <div class="right">
            <div class="top">
                <button id="menu_bar">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <div class="theme-toggler">
                    <span class="material-symbols-outlined active">light_mode</span>
                    <span class="material-symbols-outlined">dark_mode</span>
                </div>
                <div class="profile">
                    <div class="info">
                        <p><b>Bob</b></p>
                        <p>Customer</p>
                    </div>
                    <div class="profile_photo">
                        <img src="/cart/Cdashboard/user.bmp" alt="">
                    </div>
                </div>
            </div>
        </div>


        <!-- Start of the profile update form -->
        <div class="profile-update">
            <form id="userProfileForm">
                <label for="newUsername">New Username:</label>
                <input type="text" id="newUsername" name="newUsername">

                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" name="newPassword" oninput="checkPasswordStrength()">
                <div id="passwordStrength" class="password-strength"></div>


                <label id="gender" for="genderSetting">Gender Setting:</label>
                <div class="select-wrapper">
                    <select id="genderSetting" name="genderSetting" aria-label="Select Gender">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <label for="newPhoneNumber">New Phone Number:</label>
                <input type="tel" id="newPhoneNumber" name="newPhoneNumber" pattern="[0-9]{7,15}">

                <label for="newAvatar">New Avatar:</label>
                <input type="file" id="newAvatar" name="newAvatar" accept="image/*">
                <div class="avatar-preview" id="avatarPreview"></div>
                <input type="hidden" id="newAvatarUrl" name="newAvatarUrl">

                <button type="submit" id="submitBtn">Update Profile</button>
            </form>
            <div id="message" class="message"></div>
            <!-- 登录状态消息 -->
        </div>
        <!-- End of the profile update form -->
    </main>
</div>
<script src="userinformation.js"></script>

</body>
</html>
