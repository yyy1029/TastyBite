<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Payment Form</title>
</head>
<body>

<article class="card">
    <div class="container">
        <div class="card-title">
            <h2>Payment</h2>
        </div>
        <div class="card-body">
            <div class="payment-type">
                <h4>Choose payment method below</h4>
                <div class="types flex justify-space-between">
                    <div class="type selected" onclick="selectPaymentMethod(this)">
                        <div class="logo">
                            <i class="far fa-credit-card"></i>
                        </div>
                        <div class="text">
                            <p>Pay with Credit Card</p>
                        </div>
                    </div>
                    <div class="type" onclick="selectPaymentMethod(this)">
                        <div class="logo">
                            <i class="fab fa-paypal"></i>
                        </div>
                        <div class="text">
                            <p>Pay with PayPal</p>
                        </div>
                    </div>
                    <div class="type" onclick="selectPaymentMethod(this)">
                        <div class="logo">
                            <i class="fab fa-weixin"></i>
                        </div>
                        <div class="text">
                            <p>Pay with WeChat</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="payment-info flex justify-space-between">
            <div class="column billing">
                <div class="title">
                    <div class="num">1</div>
                    <h4>Billing Info</h4>
                </div>
                <div class="field full">
                    <label for="name">Full Name</label>
                    <input id="name" type="text" placeholder="Full Name">
                </div>
                <div class="field full">
                    <label for="address">Billing Address</label>
                    <input id="address" type="text" placeholder="Billing Address">
                </div>
                <div class="flex justify-space-between">
                    <div class="field half">
                        <label for="city">City</label>
                        <input id="city" type="text" placeholder="City">
                    </div>
                    <div class="field half">
                        <label for="state">State</label>
                        <input id="state" type="text" placeholder="State">
                    </div>
                </div>
                <div class="field full">
                    <label for="zip">Zip</label>
                    <input id="zip" type="text" placeholder="Zip">
                </div>
            </div>
            <div class="column shipping">
                <div class="title">
                    <div class="num">2</div>
                    <h4>Credit Card Info</h4>
                </div>
                <div class="field full">
                    <label for="name">Cardholder Name</label>
                    <input id="name" type="text" placeholder="Full Name">
                </div>
                <div class="field full">
                    <label for="address">Card Number</label>
                    <input id="address" type="text" placeholder="1234-5678-9012-3456">
                </div>
                <div class="flex justify-space-between">
                    <div class="field half">
                        <label for="city">Exp. Month</label>
                        <input id="city" type="text" placeholder="12">
                    </div>
                    <div class="field half">
                        <label for="state">Exp. Year</label>
                        <input id="state" type="text" placeholder="19">
                    </div>
                </div>
                <div class="field full">
                    <label for="zip">CVC Number</label>
                    <input id="zip" type="text" placeholder="468">
                </div>
            </div>
        </div>
    </div>
    <div class="card-actions flex justify-space-between">
        <div class="flex-start">
            <a href="../../Homepage.html" class="button button-secondary">Return to Store</a>
        </div>
        <div class="flex-end">
            <a href="javascript:;" class="btn btn-primary" id="payBtn" onclick="toPay()" style="cursor: pointer;">
                Pay
            </a>

        </div>
    </div>
    </div>
</article>

<script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.js"></script>
<script src="script.js"></script>

<script>
    let payObj = window.localStorage.getItem('pay')

</script>
</body>

</html>
